# cbindgen config for the UE plugin's C header.
#
# Invoke via: `cargo run -p gldf-unreal --bin gen-header`.
# The output (`include/gldf_unreal.h`) is committed so UE consumers don't
# need cargo.

language = "C"
header = """
/*
 * gldf_unreal — GLDF → Datasmith exporter FFI surface.
 *
 * Generated by cbindgen from crates/gldf-unreal/src/ffi.rs.
 * DO NOT EDIT BY HAND. Regenerate via:
 *   cargo run -p gldf-unreal --bin gen-header
 */
"""
include_guard = "GLDF_UNREAL_H"
no_includes = true
sys_includes = ["stdint.h", "stddef.h"]
cpp_compat = true
documentation = true
documentation_style = "c"

[parse]
parse_deps = false

[export]
include = [
  "GldfUnrealOpts",
  "gldf_unreal_version",
  "gldf_unreal_export",
  "gldf_unreal_last_report_json",
  "gldf_unreal_string_free",
]
prefix = ""

[enum]
prefix_with_name = true
