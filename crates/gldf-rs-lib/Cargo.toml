[package]
name = "gldf-rs"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
documentation = "https://docs.rs/gldf-rs/"
description = "GLDF (General Lighting Data Format) parser and writer for Rust, specifically for the Rust/WASM target as such designed for JSON format"

[lib]
name = "gldf_rs"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[features]
default = ["http"]
http = ["dep:reqwest", "dep:tokio", "dep:async-std"]
eulumdat = ["dep:eulumdat"]
l3d = ["dep:l3d_rs"]
# XSD validation via uppsala (pure Rust, zero deps, WASM-friendly).
# Off by default: it embeds the rc-3 XSD (~250 KB) and links uppsala —
# only opt in where validation actually runs (CLI, WASM banner, T4).
xsd = ["dep:uppsala"]

[dependencies]
# Serialization
quick-xml.workspace = true
serde.workspace = true
serde_json.workspace = true

# Error handling
anyhow.workspace = true

# Compression
zip.workspace = true

# Utilities
regex.workspace = true

# Async runtime (optional for HTTP)
async-std = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }

# HTTP client (optional)
reqwest = { workspace = true, optional = true }

# Photometry parsing (optional)
eulumdat = { workspace = true, optional = true }

# Date/time for IFC export
chrono = "0.4"

# Base64 encoding for LDT content preservation
base64 = "0.22"

# L3D geometry parsing (optional)
l3d_rs = { workspace = true, optional = true }

# XSD validation (optional). Pure-Rust, no system XML libs needed — works
# in WASM builds.
uppsala = { version = "0.4.0", optional = true }

# WASM-only: `std::time::SystemTime::now()` panics on
# `wasm32-unknown-unknown`. We use `js_sys::Date::now()` / `web_sys::window()`
# to seed the UUID PRNG instead. These crates are already in the WASM
# build's transitive deps via leptos + gldf-bevy, so this adds no extra
# weight on native targets (cfg-gated to wasm32).
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
web-sys = "0.3"

[dev-dependencies]
# Integration tests need direct access to eulumdat's ATLA parser
# (the optional `eulumdat` lib feature is required to compile these
# tests at all — run with `cargo test --features eulumdat`).
eulumdat = { workspace = true }
