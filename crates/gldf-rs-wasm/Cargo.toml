[package]
name = "gldf-rs-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://gldf.icu"
readme = "README.md"
documentation = "https://github.com/holg/gldf-rs"
description = "WebAssembly GLDF viewer - parse and display GLDF lighting data files in the browser"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[[bin]]
name = "gldf_rs_wasm"
path = "src/main.rs"

[features]
# `uld-rs` was the legacy sibling crate (parked at workspace level —
# its `cfb` dep pinned `uuid` to a version incompatible with the local
# Bevy fork). Live ULD/ROLF work lives in `../light-other-rs`. The
# `uld` feature is currently a no-op; rewire it to the new crate when
# bringing ULD support back.
default = []
# uld = ["dep:uld-rs"]  # parked: see workspace Cargo.toml

[dependencies]
# Core library - enable eulumdat for LDT/IES and l3d for geometry export
gldf-rs = { workspace = true, features = ["eulumdat", "l3d"] }

# Error handling
anyhow.workspace = true

# Utilities
base64.workspace = true
eulumdat.workspace = true
eulumdat-i18n.workspace = true
gloo.workspace = true

# WASM
js-sys.workspace = true
l3d_rs.workspace = true
reqwest-wasm.workspace = true
serde.workspace = true
serde_json.workspace = true
three-d.workspace = true
three-d-asset.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
yew.workspace = true
zip.workspace = true

# ULD file conversion (ULD -> GLDF) — parked, see [features] note above.
# uld-rs = { workspace = true, optional = true }

[dependencies.web-sys]
workspace = true
features = [
    "File",
    "DragEvent",
    "DataTransfer",
    "HtmlSelectElement",
    "HtmlCanvasElement",
    "Window",
    "Document",
    "HtmlCollection",
]

[dev-dependencies]
wasm-bindgen-test.workspace = true
