[package]
name = "gldf-rs-wasm"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://gldf.icu"
readme = "README.md"
documentation = "https://github.com/holg/gldf-rs"
description = "WebAssembly GLDF viewer - parse and display GLDF lighting data files in the browser"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[[bin]]
name = "gldf_rs_wasm"
path = "src/main.rs"

[features]
# `uld-rs` was the legacy sibling crate (parked at workspace level —
# its `cfb` dep pinned `uuid` to a version incompatible with the local
# Bevy fork). Live ULD/ROLF work lives in `../light-other-rs`. The
# `uld` feature is currently a no-op; rewire it to the new crate when
# bringing ULD support back.
default = []
# uld = ["dep:uld-rs"]  # parked: see workspace Cargo.toml

[dependencies]
# Core library - enable eulumdat for LDT/IES and l3d for geometry export
gldf-rs = { workspace = true, features = ["eulumdat", "l3d", "xsd"] }
# Editor API — shared reducer + actions with the TUI / CLI / Python frontends.
gldf-rs-editor = { workspace = true }
# Lisp scripting engine (acadlisp + gldf-rs glue). Drives the floating
# REPL overlay in the WASM editor.
gldf-rs-lisp = { workspace = true }
acadlisp = { path = "../../../acadlisp" }

# Error handling
anyhow.workspace = true

# Utilities
base64.workspace = true
eulumdat.workspace = true
eulumdat-i18n.workspace = true
gldf-rs-i18n.workspace = true
gloo = { workspace = true, features = ["futures"] }

# WASM
js-sys.workspace = true
l3d_rs.workspace = true
reqwest-wasm.workspace = true
serde.workspace = true
serde_json.workspace = true
three-d.workspace = true
three-d-asset.workspace = true
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
zip.workspace = true

# Leptos UI stack. Replaces Yew as of the `leptos` branch. The `csr`
# feature picks the client-side-rendering target; we don't run an
# SSR server for gldf.icu.
leptos = { workspace = true, features = ["csr"] }
leptos_meta = { workspace = true }
leptos_router = { workspace = true }
console_log = "1"
log = "0.4"
console_error_panic_hook.workspace = true

# ULD file conversion (ULD -> GLDF) — parked, see [features] note above.
# uld-rs = { workspace = true, optional = true }

[dependencies.web-sys]
workspace = true
features = [
    "File",
    "DragEvent",
    "DataTransfer",
    "HtmlSelectElement",
    "HtmlCanvasElement",
    "Window",
    "Document",
    "HtmlCollection",
]

[dev-dependencies]
wasm-bindgen-test.workspace = true
