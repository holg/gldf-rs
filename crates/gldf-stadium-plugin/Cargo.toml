[package]
name = "gldf-stadium-plugin"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Stadium floodlight visualization plugin for GLDF files using Bevy"

[lib]
name = "gldf_stadium_plugin"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gldf-stadium-viewer"
path = "src/main.rs"

[features]
default = []

# Native-only dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }

# WASM build
[target.'cfg(target_arch = "wasm32")'.dependencies]
base64 = { workspace = true }
bevy = { version = "0.18", default-features = false, features = [
    "bevy_asset",
    "bevy_winit",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_state",
    "bevy_gizmos",
    "webgl2",
    "tonemapping_luts",
    "png",
    "zstd_rust",
] }
console_error_panic_hook = { workspace = true }
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["Window", "Storage", "console"] }

[dependencies]
# GLDF parsing
gldf-rs.workspace = true

# L3D 3D model parsing
l3d_rs.workspace = true

# Photometric data
eulumdat.workspace = true

# Reuse lighting from eulumdat-bevy
eulumdat-bevy.workspace = true

# Error handling
anyhow.workspace = true
log.workspace = true

# Serialization
serde.workspace = true

# Bevy 3D engine
bevy = { version = "0.18", default-features = false, features = [
    "bevy_asset",
    "bevy_winit",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_state",
    "bevy_gizmos",
    "multi_threaded",
    "tonemapping_luts",
    "png",
    "x11",
    "wayland",
    "zstd_rust",
] }
