[package]
name = "gldf-bevy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Bevy-based 3D scene viewer for GLDF files with L3D models and LDT photometric lighting"

[lib]
name = "gldf_bevy"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gldf-bevy-viewer"
path = "src/main.rs"

[features]
default = []
webgl2 = []

# Native-only dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }

# WASM build: webgpu backend (matches eulumdat-bevy). Bevy from the local
# `photometric_proposal` fork branch so the whole graph (gldf-bevy +
# eulumdat-bevy + bevy) shares one Bevy version.
[target.'cfg(target_arch = "wasm32")'.dependencies]
base64 = { workspace = true }
bevy = { git = "https://github.com/holg/bevy.git", branch = "photometric_proposal", default-features = false, features = [
    "bevy_asset",
    "bevy_winit",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_state",
    "bevy_gizmos",
    "webgpu",
    "tonemapping_luts",
    "png",
    "zstd_rust",
] }
console_error_panic_hook = { workspace = true }
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["Window", "Storage", "console"] }

[dependencies]
# GLDF parsing
gldf-rs.workspace = true

# L3D 3D model parsing
l3d_rs.workspace = true

# Photometric data
eulumdat.workspace = true

# Reuse lighting plugins from eulumdat-bevy
eulumdat-bevy.workspace = true

# Error handling
anyhow.workspace = true
log.workspace = true

# Serialization
serde.workspace = true

# Bevy 3D engine — same git source + branch as eulumdat-bevy uses, so
# the dep graph has exactly one Bevy version. (Crates.io 0.18 +
# eulumdat-bevy's 0.19-dev fork would dual-version every bevy_* crate.)
bevy = { git = "https://github.com/holg/bevy.git", branch = "photometric_proposal", default-features = false, features = [
    "bevy_asset",
    "bevy_winit",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_state",
    "bevy_gizmos",
    "multi_threaded",
    "tonemapping_luts",
    "png",
    "x11",
    "wayland",
    "zstd_rust",
] }
