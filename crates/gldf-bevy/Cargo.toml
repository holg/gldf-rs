[package]
name = "gldf-bevy"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Bevy-based 3D scene viewer for GLDF files with L3D models and LDT photometric lighting"

[lib]
name = "gldf_bevy"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gldf-bevy-viewer"
path = "src/main.rs"

[features]
default = []
webgl2 = []

# Native-only dependencies
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }
gldf-rs-lisp = { workspace = true }
serde_json = { workspace = true }

# WASM build: webgpu backend (matches eulumdat-bevy). Published Bevy
# 0.19 — the photometric_proposal fork is retired (its shadow-field
# PRs landed upstream); one Bevy version across the whole graph.
[target.'cfg(target_arch = "wasm32")'.dependencies]
base64 = { workspace = true }
bevy = { version = "0.19", default-features = false, features = [
    "bevy_asset",
    "bevy_winit",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_state",
    "bevy_gizmos",
    "webgpu",
    "tonemapping_luts",
    "png",
    "zstd_rust",
] }
console_error_panic_hook = { workspace = true }
getrandom = { version = "0.3", features = ["wasm_js"] }
js-sys = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = ["Window", "Storage", "console"] }

[dependencies]
# GLDF parsing
gldf-rs.workspace = true

# L3D 3D model parsing
l3d_rs.workspace = true

# Photometric data
eulumdat.workspace = true

# Reuse lighting plugins from eulumdat-bevy
eulumdat-bevy.workspace = true

# Error handling
anyhow.workspace = true
log.workspace = true

# Serialization
serde.workspace = true

# Bevy 3D engine — published 0.19, same as eulumdat-bevy, so the dep
# graph has exactly one Bevy version. (Fork retired; see above.)
bevy = { version = "0.19", default-features = false, features = [
    "bevy_asset",
    "bevy_winit",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_render",
    "bevy_state",
    "bevy_gizmos",
    "multi_threaded",
    "tonemapping_luts",
    "png",
    "x11",
    "wayland",
    "zstd_rust",
] }
