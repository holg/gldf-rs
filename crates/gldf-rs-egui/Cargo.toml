[package]
name = "gldf-rs-egui"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Cross-platform GLDF viewer using egui - works on Windows, macOS, Linux"

[lib]
name = "gldf_egui"
path = "src/lib.rs"
crate-type = ["rlib"]

[[bin]]
name = "gldf-viewer-egui"
path = "src/main.rs"
required-features = ["viewer3d"]

[[bin]]
name = "gldf-l3d-viewer"
path = "src/l3d_viewer_main.rs"
required-features = ["viewer3d"]

# Batch converter — deliberately does NOT require `viewer3d`, so it can
# be built (and cross-compiled) without three-d. winit 0.28 (via
# three-d) has a host-cfg'd build.rs that breaks mac→linux cross builds.
[[bin]]
name = "gldf-batch-egui"
path = "src/batch_main.rs"

[features]
default = ["persistence", "viewer3d"]

# Enable persistence for storing app state
persistence = ["eframe/persistence"]

# three-d based interactive L3D viewer windows (the two viewer bins).
viewer3d = ["dep:three-d", "dep:three-d-asset"]

[dependencies]
# Core GLDF library
gldf-rs = { workspace = true, features = ["http"] }

# Shared editor/batch engine (template + LDT→GLDF/IFC pipeline)
gldf-rs-editor = { workspace = true, features = ["uld"] }

# UI framework
eframe.workspace = true
egui_extras.workspace = true
image.workspace = true

# Photometric data parsing and rendering
eulumdat.workspace = true

# L3D 3D model parsing
l3d_rs.workspace = true

# SVG rendering
resvg.workspace = true

# Caching
lazy_static.workspace = true

# Error handling
anyhow.workspace = true
env_logger.workspace = true

# Logging
log.workspace = true

# Serialization (for persistence + template editor JSON)
serde.workspace = true
serde_json.workspace = true

# 3D rendering for L3D (using three-d with native window; `viewer3d`)
three-d = { workspace = true, optional = true }
three-d-asset = { workspace = true, optional = true }

# File dialogs
rfd.workspace = true

# HTTP client for URL file fetching
reqwest = { workspace = true, features = ["blocking"] }
tokio.workspace = true
