[package]
name = "gldf-rs-editor"
description = "Public API surface for the gldf-rs editor. Drives the GldfAction → GldfState reducer that powers the WASM, ratatui, CLI, and Python frontends."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
gldf-rs = { workspace = true, features = ["eulumdat", "l3d"] }
serde = { workspace = true }
serde_json = { workspace = true }
serde_bytes = { workspace = true }
anyhow = { workspace = true }
log = { workspace = true }

[dev-dependencies]
# Used by the housing-color/L3D-MTL integration test to round-trip the
# embedded archive bytes and inspect the modified material.
l3d_rs = { workspace = true }
zip = { workspace = true }
# Turn on the `xsd` feature for tests only, so the script oracle can
# validate scripted products against rc-3 (same uppsala validator the
# browser banner uses) without bloating non-test editor builds.
gldf-rs = { workspace = true, features = ["eulumdat", "l3d", "xsd"] }

[features]
default = []
# Frontend-neutral validation report (engine + canonical + rc-3/rc-4 XSD
# via uppsala). Native frontends (egui, TUI) turn it on; kept optional so
# script-only consumers don't pay for the validator.
xsd = ["gldf-rs/xsd"]
