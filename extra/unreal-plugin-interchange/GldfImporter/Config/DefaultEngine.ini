; Shipped with the GldfImporter plugin. AGldfLuminaireActor (+ its structs) moved
; from the editor-only GldfImporter module into GldfRuntime so packaged games can
; load luminaire actors. These redirects keep assets saved before the move loading.
[CoreRedirects]
+ClassRedirects=(OldName="/Script/GldfImporter.GldfLuminaireActor",NewName="/Script/GldfRuntime.GldfLuminaireActor")
+StructRedirects=(OldName="/Script/GldfImporter.GldfEmitterPhotometry",NewName="/Script/GldfRuntime.GldfEmitterPhotometry")
+StructRedirects=(OldName="/Script/GldfImporter.GldfLuminaireVariant",NewName="/Script/GldfRuntime.GldfLuminaireVariant")
+StructRedirects=(OldName="/Script/GldfImporter.GldfEmitterComponent",NewName="/Script/GldfRuntime.GldfEmitterComponent")
