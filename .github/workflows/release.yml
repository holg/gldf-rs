# Build and release binaries for all platforms
name: Release Binaries

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., v0.3.3 or 0.3.3)'
        required: true
        type: string
      create_release:
        description: 'Create GitHub Release'
        required: true
        type: boolean
        default: true
      prerelease:
        description: 'Mark as pre-release'
        required: false
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # Build the native desktop apps: egui editor + three-d L3D viewer, CLI,
  # TUI and the Bevy 3D viewer. Bin names match crates/*/Cargo.toml —
  # the old `gldf-viewer-egui` target no longer exists.
  #
  # NOTE: the workspace's sibling path deps (../eulumdat-rs, ../l3d-rs,
  # ../light-other-rs) must be flipped to published versions before
  # tagging a release, same as for crates-publish.yml.
  build-desktop:
    name: Build desktop apps (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            suffix: linux-x86_64
            ext: ""
          - os: macos-latest
            target: x86_64-apple-darwin
            suffix: macos-x86_64
            ext: ""
          - os: macos-latest
            target: aarch64-apple-darwin
            suffix: macos-aarch64
            ext: ""
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            suffix: windows-x86_64
            ext: ".exe"

    steps:
      - uses: actions/checkout@v4
      # Local builds take sibling checkouts through [patch.crates-io] (the last
      # section of Cargo.toml); CI and releases use the crates.io versions.
      - name: Remove the local patch section
        shell: python
        run: |
          import re, pathlib
          p = pathlib.Path("Cargo.toml")
          p.write_text(re.sub(r'\n\[patch\.crates-io\].*', '\n', p.read_text(), flags=re.DOTALL))

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libasound2-dev libudev-dev libwayland-dev

      - name: Build gldf-editor-egui + gldf-l3d-viewer
        run: cargo build --release -p gldf-rs-egui --bin gldf-editor-egui --bin gldf-l3d-viewer --target ${{ matrix.target }}

      - name: Build gldf-cli
        run: cargo build --release -p gldf-rs-cli --bin gldf-cli --target ${{ matrix.target }}

      - name: Build gldf-edit (TUI)
        run: cargo build --release -p gldf-rs-tui --bin gldf-edit --target ${{ matrix.target }}

      - name: Build gldf-bevy-viewer
        run: cargo build --release -p gldf-bevy --bin gldf-bevy-viewer --target ${{ matrix.target }}

      - name: Prepare artifacts
        shell: bash
        run: |
          mkdir -p artifacts/desktop
          for bin in gldf-editor-egui gldf-l3d-viewer gldf-cli gldf-edit gldf-bevy-viewer; do
            cp "target/${{ matrix.target }}/release/${bin}${{ matrix.ext }}" \
               "artifacts/desktop/${bin}-${{ matrix.suffix }}${{ matrix.ext }}"
          done
          chmod +x artifacts/desktop/* || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.target }}
          path: artifacts/desktop/
  build-wasm:
    name: Build gldf-rs-wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Local builds take sibling checkouts through [patch.crates-io] (the last
      # section of Cargo.toml); CI and releases use the crates.io versions.
      - name: Remove the local patch section
        shell: python
        run: |
          import re, pathlib
          p = pathlib.Path("Cargo.toml")
          p.write_text(re.sub(r'\n\[patch\.crates-io\].*', '\n', p.read_text(), flags=re.DOTALL))

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install trunk
        run: cargo install trunk

      - name: Build WASM
        working-directory: crates/gldf-rs-wasm
        run: trunk build --release

      - name: Package WASM dist
        run: |
          mkdir -p artifacts/gldf-rs-wasm
          cp -r crates/gldf-rs-wasm/dist/* artifacts/gldf-rs-wasm/
          cd artifacts && zip -r gldf-rs-wasm-dist.zip gldf-rs-wasm/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gldf-rs-wasm
          path: artifacts/gldf-rs-wasm-dist.zip

  # Build gldf-rs-ffi (FFI libraries for mobile and desktop)
  build-ffi:
    name: Build gldf-rs-ffi (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Desktop platforms
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            lib_name: libgldf_ffi.so
            platform: linux
          - os: macos-latest
            target: aarch64-apple-darwin
            lib_name: libgldf_ffi.dylib
            platform: macos
          # iOS platforms
          - os: macos-latest
            target: aarch64-apple-ios
            lib_name: libgldf_ffi.a
            platform: ios
          - os: macos-latest
            target: x86_64-apple-ios
            lib_name: libgldf_ffi.a
            platform: ios-simulator
          # Android platforms (all common architectures)
          - os: ubuntu-latest
            target: aarch64-linux-android
            lib_name: libgldf_ffi.so
            platform: android
            android_abi: arm64-v8a
          - os: ubuntu-latest
            target: armv7-linux-androideabi
            lib_name: libgldf_ffi.so
            platform: android
            android_abi: armeabi-v7a
          - os: ubuntu-latest
            target: x86_64-linux-android
            lib_name: libgldf_ffi.so
            platform: android
            android_abi: x86_64

    steps:
      - uses: actions/checkout@v4
      # Local builds take sibling checkouts through [patch.crates-io] (the last
      # section of Cargo.toml); CI and releases use the crates.io versions.
      - name: Remove the local patch section
        shell: python
        run: |
          import re, pathlib
          p = pathlib.Path("Cargo.toml")
          p.write_text(re.sub(r'\n\[patch\.crates-io\].*', '\n', p.read_text(), flags=re.DOTALL))

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Android NDK
        if: matrix.platform == 'android'
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r26b

      - name: Set Android linker
        if: matrix.platform == 'android'
        run: |
          echo "Setting up linker for ${{ matrix.target }}"
          NDK_TOOLCHAIN="${{ steps.setup-ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          case "${{ matrix.target }}" in
            aarch64-linux-android)
              echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${NDK_TOOLCHAIN}/aarch64-linux-android24-clang" >> $GITHUB_ENV
              ;;
            armv7-linux-androideabi)
              echo "CARGO_TARGET_ARMV7_LINUX_ANDROIDEABI_LINKER=${NDK_TOOLCHAIN}/armv7a-linux-androideabi24-clang" >> $GITHUB_ENV
              ;;
            x86_64-linux-android)
              echo "CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=${NDK_TOOLCHAIN}/x86_64-linux-android24-clang" >> $GITHUB_ENV
              ;;
          esac

      - name: Build FFI library
        run: cargo build --release -p gldf-rs-ffi --target ${{ matrix.target }}

      - name: Prepare artifacts
        run: |
          mkdir -p artifacts/gldf-rs-ffi/${{ matrix.platform }}/${{ matrix.target }}
          cp target/${{ matrix.target }}/release/${{ matrix.lib_name }} artifacts/gldf-rs-ffi/${{ matrix.platform }}/${{ matrix.target }}/ || true
          cp target/${{ matrix.target }}/release/libgldf_ffi.a artifacts/gldf-rs-ffi/${{ matrix.platform }}/${{ matrix.target }}/ || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gldf-rs-ffi-${{ matrix.platform }}-${{ matrix.target }}
          path: artifacts/gldf-rs-ffi/

  # Create GitHub Release
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-desktop, build-wasm, build-ffi]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # Local builds take sibling checkouts through [patch.crates-io] (the last
      # section of Cargo.toml); CI and releases use the crates.io versions.
      - name: Remove the local patch section
        shell: python
        run: |
          import re, pathlib
          p = pathlib.Path("Cargo.toml")
          p.write_text(re.sub(r'\n\[patch\.crates-io\].*', '\n', p.read_text(), flags=re.DOTALL))

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
            # Add 'v' prefix if not present
            if [[ ! "$VERSION" =~ ^v ]]; then
              VERSION="v${VERSION}"
            fi
          else
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Release version: ${VERSION}"

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Display structure of downloaded files
        run: ls -laR artifacts/

      - name: Organize release assets
        run: |
          mkdir -p release-assets

          # desktop binaries (egui editor, L3D viewer, CLI, TUI, Bevy viewer)
          for dir in artifacts/desktop-*/; do
            cp "$dir"/* release-assets/ 2>/dev/null || true
          done

          # gldf-rs-wasm
          cp artifacts/gldf-rs-wasm/*.zip release-assets/ 2>/dev/null || true

          # gldf-rs-ffi - create per-platform archives
          # Structure: artifacts/gldf-rs-ffi-{platform}-{target}/gldf-rs-ffi/{platform}/{target}/
          for artifact_dir in artifacts/gldf-rs-ffi-*/; do
            for platform_dir in "$artifact_dir"gldf-rs-ffi/*/; do
              platform=$(basename "$platform_dir")
              for target_dir in "$platform_dir"*/; do
                target=$(basename "$target_dir")
                echo "Packaging gldf-rs-ffi for ${platform}/${target}"
                cd "$target_dir" && zip -r "../../../../../../release-assets/gldf-rs-ffi-${platform}-${target}.zip" . && cd - || true
              done
            done
          done

          # Create combined Android archive with all ABIs for convenience
          mkdir -p android-combined
          for artifact_dir in artifacts/gldf-rs-ffi-android-*/; do
            for target_dir in "$artifact_dir"gldf-rs-ffi/android/*/; do
              target=$(basename "$target_dir")
              mkdir -p "android-combined/${target}"
              cp "$target_dir"/* "android-combined/${target}/" 2>/dev/null || true
            done
          done
          if [ -d "android-combined" ] && [ "$(ls -A android-combined)" ]; then
            cd android-combined && zip -r "../release-assets/gldf-rs-ffi-android-all.zip" . && cd -
          fi
          rm -rf android-combined

          ls -la release-assets/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Release ${{ steps.version.outputs.version }}
          files: release-assets/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
