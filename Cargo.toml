[workspace]
resolver = "2"
members = [
    #    "crates/gldf-rs-slint",
    "crates/gldf-bevy",
    "crates/gldf-rs-egui",
    "crates/gldf-rs-ffi",
    "crates/gldf-rs-i18n",
    "crates/gldf-rs-lib",
    "crates/gldf-rs-python",
    "crates/gldf-rs-cli",
    "crates/gldf-rs-editor",
    "crates/gldf-rs-lisp",
    "crates/gldf-rs-tui",
    "crates/gldf-rs-wasm",
    "crates/gldf-starsky-wasm",
    "crates/gldf-unreal",
    "crates/gldf-stadium-plugin",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
authors = ["Holger Trahe <trahe@mac.com>"]
license = "AGPL-3.0-or-later"
repository = "https://github.com/holg/gldf-rs"
homepage = "https://github.com/holg/gldf-rs"

[workspace.dependencies]
# Core library
gldf-rs = { version = "0.5.0", path = "crates/gldf-rs-lib", default-features = false }
# Editor API (frontend-agnostic) — all consumers (WASM, TUI, CLI, Python, FFI) drive this.
gldf-rs-editor = { version = "0.5.0", path = "crates/gldf-rs-editor" }
gldf-rs-lisp = { version = "0.5.0", path = "crates/gldf-rs-lisp" }
# Translation store (gldf.* keys + RAL Classic names). Frontends depend on this crate;
# the lib only references its Translator trait.
gldf-rs-i18n = { version = "0.5.0", path = "crates/gldf-rs-i18n" }

# Serde helper for binary fields (Vec<u8> → JSON byte arrays without UTF-8 lossy detour).
serde_bytes = "0.11"

# TUI dependencies
ratatui = { version = "0.30", features = ["unstable-widget-ref"] }
# 0.2.x is the ratatui-0.29-compatible line; 0.3+ moved to ratatui 0.30.
ratatui-explorer = "0.3"
crossterm = "0.29"
# OBJ parser — the TUI's L3D viewer extracts triangles from the OBJ
# files inside the .l3d archive and renders them as a braille-canvas
# wireframe. Used only by gldf-rs-tui.
tobj = "4"
clap = { version = "4", features = ["derive"] }
dialoguer = { version = "0.11", default-features = false }
dirs = "5"
insta = { version = "1", features = ["yaml"] }

# Serialization
quick-xml = { version = "0.37", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }
serde-xml-rs = "0.6"
serde_json = "1.0"

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# Async runtime
async-std = "1.12"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "test-util", "macros"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
reqwest-wasm = { version = "0.11", features = ["blocking"] }

# Compression - use zip 2.x for better compatibility
zip = { version = "2", default-features = false, features = ["deflate"] }

# Utilities
base64 = "0.22"
lazy_static = "1.5"
regex = "1.10"

# UI framework (egui)
eframe = { version = "0.36", default-features = false, features = [
  "accesskit",
  "default_fonts",
  "glow",
  "persistence",
] }
egui_extras = { version = "0.36", features = ["all_loaders", "image", "svg"] }

# Image processing
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
resvg = "0.48"

# 3D rendering
three-d = { version = "0.19", default-features = true }
three-d-asset = { version = "0.10", features = ["obj"] }

# Bevy 3D engine
bevy = { version = "0.19", default-features = false, features = [
    "bevy_asset",
    "bevy_render",
    "bevy_core_pipeline",
    "bevy_pbr",
    "bevy_winit",
    "bevy_gizmos",
    "png",
    "webgl2",
    "x11",
    "zstd_rust",
] }

# The eulumdat family and l3d_rs: crates.io versions here (what
# `cargo publish` and CI use); local builds take the sibling checkouts
# through `[patch.crates-io]` at the end of this file, so the whole graph
# has exactly one eulumdat and one eulumdat-bevy (Bevy 0.19).
eulumdat-bevy = "0.8"
eulumdat = "0.8"
# Family-shared i18n (the viewer's UI chrome via the `extra` flat-key
# section, since eulumdat-i18n 0.6.1).
eulumdat-i18n = "0.8"
# 0.2.4 carries the `fbx-export` feature (ASCII FBX 7.4 writer) used by
# gldf-unreal.
l3d_rs = "0.2.4"
# AutoLISP engine behind gldf-rs-lisp; crates.io version here, the sibling
# checkout through `[patch.crates-io]` for local builds.
acadlisp = "0.2"

# ULD/ROLF file conversion — parked. The legacy `../uld-rs` pulls
# `cfb 0.10` which pins `uuid = ^1` to 1.19.0; published Bevy 0.19
# wants a newer uuid, and Cargo can't satisfy both with a single
# uuid version. Live ULD work lives
# in `../light-other-rs` (on the `light-other` branch). Re-enable
# once the `uld` feature is rebound to that crate.
# uld-rs = { path = "../uld-rs", features = ["gldf"] }

# File dialogs (native)
rfd = "0.17"

# WASM
gloo = "0.11"
gloo-file = { version = "0.3", features = ["futures"] }
js-sys = "0.3"
# Pinned so the whole graph unifies on ONE wasm-bindgen (eframe 0.36's
# js-sys 0.3.103 requires exactly this version). trunk downloads
# a matching wasm-bindgen CLI automatically; if any tool needs a manual
# CLI: `cargo install -f wasm-bindgen-cli --version 0.2.126`.
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4"
wasm-bindgen-test = "0.3"
web-sys = "0.3"
yew = { version = "0.22", features = ["csr"] }

# Leptos stack — 0.8.x. Each consumer picks the features it needs
# (csr/hydrate for the wasm bundle, ssr for a server binary).
console_error_panic_hook = "0.1"
leptos = { version = "0.8", default-features = false }
leptos_axum = { version = "0.8", default-features = false }
leptos_meta = { version = "0.8", default-features = false }
leptos_router = { version = "0.8", default-features = false }

# Python
pyo3 = { version = "0.24", features = ["extension-module", "abi3-py38"] }
pyo3-build-config = "0.24"

# FFI (UniFFI)
uniffi = { version = "0.28", features = ["cli"] }

# Logging
env_logger = "0.11"
log = "0.4"

# Build utilities
version_check = "0.9"

# [patch.crates-io] removed — eulumdat-bevy is now path-dep'd above, so
# crates.io eulumdat never enters the graph and there's nothing to patch.

# Distribution profile for cross_build_on_mac.sh (see scripts/
# cross-build.toml). LTO belongs in a profile, not RUSTFLAGS — cargo
# passes `-C embed-bitcode=no` to deps unless the profile declares lto,
# so `-C lto=fat` via RUSTFLAGS aborts the build.
[profile.release-dist]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "symbols"

# ---------------------------------------------------------------------------
# leptos-blitz native port: the WHOLE leptos family resolves to the local
# fork (branch blitz-renderer) so the same 0.8-line API serves both the
# wasm editor build and the native (Blitz) build, with ONE tachys in the
# graph. Remove when the blitz backend ships in a leptos release.
# ---------------------------------------------------------------------------
[patch.crates-io]
# Sibling checkouts (eulumdat-rs, l3d-rs beside gldf-rs): local builds use
# them instead of the crates.io versions declared above.
eulumdat = { path = "../eulumdat-rs/crates/eulumdat" }
eulumdat-bevy = { path = "../eulumdat-rs/crates/eulumdat-bevy" }
eulumdat-i18n = { path = "../eulumdat-rs/crates/eulumdat-i18n" }
l3d_rs = { path = "../l3d-rs/crates/l3d_rs" }
acadlisp = { path = "../acadlisp" }
leptos = { path = "../leptos/leptos" }
leptos_dom = { path = "../leptos/leptos_dom" }
leptos_macro = { path = "../leptos/leptos_macro" }
leptos_server = { path = "../leptos/leptos_server" }
leptos_config = { path = "../leptos/leptos_config" }
leptos_meta = { path = "../leptos/meta" }
leptos_router = { path = "../leptos/router" }
tachys = { path = "../leptos/tachys" }
reactive_graph = { path = "../leptos/reactive_graph" }
reactive_stores = { path = "../leptos/reactive_stores" }
server_fn = { path = "../leptos/server_fn" }
hydration_context = { path = "../leptos/hydration_context" }
